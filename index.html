<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>マッサマンゲーム 表示ボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Zen+Old+Mincho:wght@700;900&display=swap" rel="stylesheet">
<style>
  /* ============ デザイントークン（spec.md 6章：夜の砂漠と諜報の機密ファイル） ============ */
  :root {
    --night: #100D0A;       /* 夜空 */
    --horizon: #4A3620;     /* 地平線の砂明かり */
    --bone: #EDE3CF;        /* 砂の白（文字） */
    --muted: rgba(237, 227, 207, .56);
    --faint: rgba(237, 227, 207, .22);
    --line: rgba(237, 227, 207, .14);
    --card: rgba(237, 227, 207, .05);
    --sand: #C9A56A;        /* 基調のアクセント */
    --signal: #D23B2A;      /* 判子・記録中・確定操作 */
    --on-color: #15100B;
    --mincho: "Zen Old Mincho", "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "Noto Serif JP", serif;
    --ui: "Zen Kaku Gothic New", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
    --mono: "Share Tech Mono", "SFMono-Regular", Menlo, Consolas, monospace;
    color-scheme: dark;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  body.light {
    --night: #F8F7F3;
    --horizon: #E7DDC9;
    --bone: #27231D;
    --muted: rgba(39, 35, 29, .62);
    --faint: rgba(39, 35, 29, .2);
    --line: rgba(39, 35, 29, .18);
    --card: rgba(39, 35, 29, .06);
    --on-color: #FFFDF8;
    color-scheme: light;
    background:
      radial-gradient(90% 45% at 50% 108%, rgba(201, 165, 106, .18) 0%, transparent 70%),
      linear-gradient(180deg, #FFFFFF 0%, #F8F7F3 70%, var(--horizon) 100%);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background:
      radial-gradient(90% 45% at 50% 108%, rgba(201, 165, 106, .22) 0%, transparent 70%),
      linear-gradient(180deg, var(--night) 0%, #14100C 52%, #231A11 82%, var(--horizon) 100%);
    background-attachment: fixed;
    color: var(--bone);
    font-family: var(--ui);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  /* 地図の方眼 */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      linear-gradient(rgba(237, 227, 207, .035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(237, 227, 207, .035) 1px, transparent 1px);
    background-size: 88px 88px;
    -webkit-mask-image: radial-gradient(ellipse at 50% 45%, #000 30%, transparent 85%);
    mask-image: radial-gradient(ellipse at 50% 45%, #000 30%, transparent 85%);
  }
  /* フィルムの粒子 */
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 50; opacity: .07;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  body.light::after { opacity: .025; }
  body.light::before {
    background-image:
      linear-gradient(rgba(39, 35, 29, .06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(39, 35, 29, .06) 1px, transparent 1px);
  }
  body.light .ghost { background: rgba(255,255,255,.72); color: var(--bone); }
  body.light .ghost:hover { background: rgba(39,35,29,.08); border-color: rgba(39,35,29,.36); }
  body.light .theme-field::placeholder { color: rgba(39,35,29,.34); }
  body.light .stepper button:hover:not(:disabled), body.light .name-chip:focus-within { background: rgba(39,35,29,.09); }
  body.light .word { background: linear-gradient(90deg, rgba(39,35,29,.09), rgba(39,35,29,.035)); }
  body.light .word.latest { background: color-mix(in srgb, var(--c) 20%, rgba(255,255,255,.78)); }
  body.light .dock { background: rgba(255,255,255,.84); border-color: rgba(39,35,29,.2); box-shadow: 0 1rem 3rem rgba(39,35,29,.16); }
  body.light #answerInput { background: rgba(255,255,255,.74); }
  body.light #answerInput::placeholder { color: rgba(39,35,29,.46); }
  button, input, output { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--sand); outline-offset: 3px; }
  kbd {
    font-family: var(--mono); font-size: .9em;
    border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 3px; padding: 0 .4em;
  }

  .screen { position: absolute; inset: 0; display: none; z-index: 1; }
  .screen.active { display: flex; }

  /* 共通ボタン */
  .ghost {
    border: 1px solid var(--line); background: rgba(16, 13, 10, .35); color: var(--bone);
    border-radius: 4px; padding: .45em 1em; font-weight: 700; cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  .ghost:hover { background: rgba(237, 227, 207, .08); border-color: rgba(237, 227, 207, .32); }
  .ghost.armed { background: var(--signal); border-color: var(--signal); color: var(--bone); }
  .primary {
    border: none; background: var(--sand); color: var(--on-color);
    border-radius: 4px; padding: .8em 2.8em; font-weight: 900; font-size: 1.1rem; letter-spacing: .12em; cursor: pointer;
    box-shadow: 0 .6rem 2rem rgba(201, 165, 106, .22);
    transition: transform .15s, background .15s;
  }
  .primary:hover { transform: translateY(-2px); background: #D6B47A; }

  .rec-dot {
    display: inline-block; width: .6em; height: .6em; border-radius: 50%;
    background: var(--signal); box-shadow: 0 0 .6em var(--signal);
    animation: blink 1.1s steps(2, jump-none) infinite;
  }
  @keyframes blink { 50% { opacity: .15; } }

  /* ============ お題入力画面 ============ */
  #entry, #setup {
    flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(1.4rem, 4vh, 2.6rem); padding: 2rem 6vw; text-align: center;
  }
  #entry h1, #setup h1 {
    margin: 0; font-family: var(--mincho); font-weight: 900;
    font-size: clamp(1.8rem, 4.2vw, 3.3rem); letter-spacing: .08em;
  }
  .theme-field {
    width: min(1000px, 100%); border: none; border-bottom: 2px solid var(--sand);
    background: transparent; color: var(--bone); caret-color: var(--signal);
    font-family: var(--mincho); font-weight: 900; font-size: clamp(2.2rem, 6vw, 5rem);
    text-align: center; padding: .1em 0 .25em; outline: none;
    transition: border-color .2s;
  }
  .theme-field::placeholder { color: rgba(237, 227, 207, .16); }
  .theme-field:focus-visible { border-bottom-color: var(--bone); }
  .players { display: flex; flex-direction: column; align-items: center; gap: .9rem; }
  .count-row { display: flex; align-items: center; gap: .9rem; font-weight: 700; color: var(--muted); letter-spacing: .08em; }
  .stepper {
    display: flex; align-items: center; gap: .1rem; padding: .15rem;
    background: var(--card); border: 1px solid var(--line); border-radius: 4px; color: var(--bone);
  }
  .stepper button {
    width: 2.3rem; height: 2.2rem; border: none; border-radius: 3px;
    background: transparent; font-size: 1.2rem; font-weight: 700; cursor: pointer;
  }
  .stepper button:hover:not(:disabled) { background: rgba(237, 227, 207, .1); }
  .stepper button:disabled { opacity: .25; cursor: default; }
  .stepper output { min-width: 3.4em; font-family: var(--mono); font-size: 1.15rem; }
  .names { display: flex; flex-wrap: wrap; justify-content: center; gap: .55rem; max-width: 1000px; }
  .name-chip {
    display: flex; align-items: center; gap: .5rem;
    padding: .25rem .45rem .25rem .7rem; border-radius: 3px;
    background: var(--card);
    border: 1px solid var(--line);
    border-left: 4px solid var(--c);
    transition: background .15s;
  }
  .name-chip:focus-within { background: rgba(237, 227, 207, .09); }
  .name-chip input {
    width: 7.5em; padding: .3rem .2rem; border: none; background: transparent;
    font-weight: 700; font-size: 1rem; outline: none;
  }
  .setup-actions { display: flex; flex-direction: column; align-items: center; gap: .8rem; }
  .hint { margin: 0; color: var(--muted); font-size: .9rem; }
  .setup-fs { position: absolute; top: 1.2rem; right: 1.2rem; }
  .mode-toggle { position: absolute; top: 1.2rem; left: 1.2rem; width: 2.7rem; height: 2.3rem; padding: 0; font-size: 1.25rem; line-height: 1; }
  .dock .mode-toggle { position: static; }

  /* ============ 開始アナウンス（A-1, E-5） ============ */
  #announce { align-items: center; justify-content: center; padding: 0 4vw; }
  .letterbox {
    position: absolute; left: 0; right: 0; height: 13vh; background: #000;
    animation: letterbox .6s cubic-bezier(.7, 0, .2, 1) both;
  }
  .letterbox.top { top: 0; transform-origin: top; }
  .letterbox.bottom { bottom: 0; transform-origin: bottom; }
  @keyframes letterbox { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  #announceText {
    margin: 0; font-family: var(--mincho); font-weight: 900;
    font-size: clamp(2.4rem, 7.6vw, 7rem); letter-spacing: .1em; text-align: center;
    text-shadow: 0 0 .35em rgba(201, 165, 106, .35);
  }

  /* 解読中の文字と確定の光（E-2） */
  .ch { display: inline-block; }
  .ch.scr { color: var(--sand); opacity: .55; }
  .ch.lock { animation: lock .45s ease-out; }
  @keyframes lock {
    0%   { color: #fff; text-shadow: 0 0 .25em #fff, 0 0 .6em var(--c, var(--sand)); }
    100% { }
  }

  /* ============ 本番画面 ============ */
  #board { flex-direction: column; }
  .theme-band {
    display: flex; align-items: center; gap: clamp(.9rem, 1.8vw, 1.8rem);
    padding: clamp(1rem, 3vh, 2.2rem) 4vw clamp(.7rem, 2vh, 1.3rem);
    border-bottom: 1px solid var(--line);
  }
  .theme-band .tag {
    flex: none; transform: rotate(-4deg);
    padding: .05em .4em; border: .12em solid var(--signal); border-radius: .12em;
    color: var(--signal); font-family: var(--mincho); font-weight: 900; letter-spacing: .12em;
    font-size: clamp(1rem, 2vw, 1.7rem); opacity: .95;
  }
  .theme-band .tag.stamp { animation: stamp .5s cubic-bezier(.3, 1.6, .5, 1) both; animation-delay: var(--d, 0ms); }
  @keyframes stamp {
    from { transform: rotate(-14deg) scale(2.4); opacity: 0; }
    to   { transform: rotate(-4deg) scale(1); opacity: .95; }
  }
  .theme-band .theme {
    flex: 1; min-width: 0;
    font-family: var(--mincho); font-weight: 900; font-size: clamp(2rem, 6vw, 5.6rem); line-height: 1.15;
    letter-spacing: .04em; word-break: break-word;
    text-shadow: 0 0 .45em rgba(201, 165, 106, .28);
  }
  .hud {
    flex: none; align-self: flex-start;
    display: flex; flex-direction: column; align-items: flex-end; gap: .2em;
    font-size: clamp(.8rem, 1.2vw, 1.05rem); color: var(--muted); letter-spacing: .06em;
  }
  .hud .rec { display: flex; align-items: center; gap: .45em; color: var(--bone); font-weight: 700; }
  .hud .num { font-family: var(--mono); color: var(--bone); font-size: 1.2em; }

  /* 上→下に（回答者数×2）個ずつ、埋まったら右の列へ（D-2〜D-4） */
  .words {
    flex: 1; min-height: 0; overflow: hidden;
    padding: 3vh 4vw;
    display: grid;
    grid-template-rows: repeat(var(--rows, 6), auto);
    grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr));
    grid-auto-flow: column;
    align-content: start; gap: .26em .5em;
    font-size: 64px; /* JSで自動調整 */
    transition: opacity .25s, filter .25s;
  }
  #board.typing .words { opacity: .18; filter: blur(3px); }
  .words.empty { display: flex; align-items: center; justify-content: center; }
  .words .placeholder { font-size: clamp(1.05rem, 2.4vw, 1.7rem); color: var(--muted); font-weight: 700; letter-spacing: .06em; }
  .word {
    position: relative; display: flex; align-items: center; gap: .4em; min-width: 0;
    /* 右側は文字0.8個分の余白を確保する（D-7）。文字サイズの自動調整もこの余白を守る */
    padding: .1em .8em .1em .32em; border-radius: .06em;
    background: linear-gradient(90deg, rgba(237, 227, 207, .075), rgba(237, 227, 207, .025));
    border: .015em solid var(--line);
    border-left: .12em solid var(--c);
    transform-origin: 0 0;
  }
  .word .num {
    flex: none; font-family: var(--mono); font-size: .42em; color: var(--c);
    letter-spacing: .04em; font-variant-numeric: tabular-nums;
  }
  .word .body { display: flex; flex-direction: column; min-width: 0; }
  .word .text { font-family: var(--mincho); font-weight: 900; white-space: nowrap; line-height: 1.22; }
  .word .who {
    font-size: .25em; font-weight: 700; color: var(--c); line-height: 1.25; letter-spacing: .08em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .word.latest {
    background: color-mix(in srgb, var(--c) 17%, rgba(16, 13, 10, .6));
    border-color: var(--c);
    box-shadow: 0 0 .5em color-mix(in srgb, var(--c) 40%, transparent);
  }
  .word.flying { z-index: 20; }
  .word.new { animation: settle .45s cubic-bezier(.2, 1.5, .45, 1) both; }
  .word.stamped { animation: settle .38s cubic-bezier(.3, 1.8, .5, 1); }
  @keyframes settle {
    0%   { transform: scale(1.12); }
    55%  { transform: scale(.97); }
    100% { transform: none; }
  }
  .word.stamped::after {
    content: ""; position: absolute; inset: -.06em; border: .05em solid var(--c); pointer-events: none;
    animation: ripple .7s ease-out forwards;
  }
  @keyframes ripple { from { opacity: 1; transform: scale(1); } to { opacity: 0; transform: scale(1.18, 1.7); } }

  /* ============ エコー（E-1〜E-3） ============ */
  .echo {
    position: fixed; inset: 0; z-index: 30; pointer-events: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 0 4vw 20vh; opacity: 0; transition: opacity .12s;
  }
  .echo.show { opacity: 1; }
  .echo-head {
    display: flex; align-items: center; gap: .6em; margin-bottom: .6em;
    font-size: clamp(1rem, 2vw, 1.6rem); font-weight: 700; letter-spacing: .12em; color: var(--muted);
  }
  .echo-who { color: var(--c); font-weight: 900; }
  .echo-text {
    font-family: var(--mincho); font-weight: 900; white-space: nowrap; line-height: 1.15;
    font-size: min(15vw, 25vh); letter-spacing: .03em;
    text-shadow: 0 0 .08em var(--c), 0 0 .4em var(--c);
    text-shadow: 0 0 .08em var(--c), 0 0 .4em color-mix(in srgb, var(--c) 55%, transparent);
  }

  /* ============ 入力ドック（UI-6） ============ */
  .dock {
    position: relative; z-index: 35;
    width: min(1200px, calc(100% - 4vw)); margin: 0 auto 1rem;
    display: flex; flex-wrap: wrap; align-items: center; gap: .7rem;
    padding: .75rem .85rem .6rem; border-radius: 6px;
    background: rgba(16, 13, 10, .78);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    border: 1px solid var(--line); border-top: 1px solid rgba(201, 165, 106, .45);
    box-shadow: 0 1rem 3rem rgba(0, 0, 0, .5);
  }
  .dock.hidden { display: none; }
  .dock.collapsed { padding: .25rem .5rem; justify-content: center; }
  .dock.collapsed .dock-body { display: none; }
  .who-tabs { display: flex; flex-wrap: wrap; gap: .35rem; }
  .players-strip { position: relative; z-index: 35; width: min(1200px, calc(100% - 4vw)); margin: 0 auto .55rem; display: flex; justify-content: center; }
  .players-strip.hidden { display: none; }
  .players-strip .who-tabs { padding: .3rem; border: 1px solid var(--line); border-radius: 5px; background: rgba(16,13,10,.42); }
  .players-strip .who-tabs button { min-width: 7rem; padding: .58em 1.15em; border-radius: 3px; font-size: 1.05rem; }
  body.light .players-strip .who-tabs { background: rgba(255,255,255,.7); }
  .dock-toggle { position: absolute; right: .35rem; top: .25rem; transform: translateY(-100%); width: 2rem; height: 1.35rem; padding: 0; border: 1px solid var(--line); border-bottom: 0; border-radius: 3px 3px 0 0; background: rgba(16,13,10,.78); color: var(--muted); cursor: pointer; font-family: var(--mono); line-height: 1; }
  .dock-toggle:hover { color: var(--bone); border-color: var(--sand); }
  body.light .dock-toggle { background: rgba(255,255,255,.84); }
  .who-tabs button {
    padding: .4em .85em; border-radius: 3px; cursor: pointer;
    background: transparent; font-weight: 700;
    border: 1px solid var(--line); border-left: 4px solid var(--c);
  }
  .who-tabs button[aria-pressed="true"] { background: var(--c); border-color: var(--c); color: var(--on-color); }
  .state-icon { display: inline-block; margin-left: .3em; color: var(--signal); font-family: var(--mono); font-weight: 900; }
  .player-box.out .state-icon { opacity: .8; }
  .player-box { display: flex; flex-direction: column; gap: .25rem; min-width: 6rem; }
  .player-box.out { opacity: .6; }
  .player-box .eliminate { font-size: .72rem; padding: .3em; border-left-width: 1px; }
  .who-tabs button:disabled { cursor: default; }
  .event-overlay { position: fixed; inset: 0; z-index: 60; background: rgba(16,13,10,.92); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.5rem; padding: 5vw; text-align: center; }
  .event-overlay[hidden] { display: none; }
  .event-overlay h2 { margin: 0; color: var(--sand); font-size: clamp(1.5rem, 4vw, 3rem); }
  .event-overlay p { margin: 0; max-width: 100%; overflow-wrap: anywhere; font-family: var(--mincho); font-size: clamp(2rem, 9vw, 7rem); }
  #winnerEvent { overflow: hidden; isolation: isolate; background: radial-gradient(circle at 50% 48%, rgba(201,165,106,.18), transparent 42%), rgba(16,13,10,.94); }
  body.light #winnerEvent { background: radial-gradient(circle at 50% 48%, rgba(201,165,106,.22), transparent 42%), rgba(248,247,243,.96); }
  #winnerEvent::before { content: ""; position: absolute; inset: -100%; border-radius: 50%; background: repeating-conic-gradient(from 0deg, rgba(201,165,106,.12) 0deg 7deg, transparent 7deg 18deg), repeating-linear-gradient(0deg, transparent 0 18px, rgba(237,227,207,.035) 19px 20px); opacity: .42; pointer-events: none; z-index: -1; }
  #winnerEvent::after { content: "勝者確定"; position: absolute; top: 16%; right: 10%; color: var(--signal); border: .12em solid var(--signal); padding: .25em .45em; font-family: var(--mincho); font-weight: 900; letter-spacing: .15em; transform: rotate(-8deg) scale(0); opacity: 0; pointer-events: none; }
  #winnerEvent.winner-reveal::after { animation: winner-stamp .55s .35s cubic-bezier(.3,1.6,.5,1) forwards; }
  #winnerEvent.winner-reveal::before { animation: winner-rays 9s linear infinite; }
  .winner-kicker { margin: 0; color: var(--signal); font-family: var(--mono); font-size: clamp(1rem, 2vw, 1.5rem); letter-spacing: .35em; opacity: .9; }
  #winnerName { display: flex; align-items: baseline; justify-content: center; gap: .16em; }
  #winnerName small { font-size: .28em; font-weight: 700; letter-spacing: .08em; }
  #winnerEvent.winner-reveal #winnerTitle { animation: winner-title .55s .45s ease-out both; }
  #winnerEvent.winner-reveal #winnerName { animation: winner-name .8s .1s cubic-bezier(.2,1.4,.4,1) both; }
  #winnerEvent.winner-reveal #closeWinner { animation: winner-button .45s .9s ease-out both; }
  @keyframes winner-stamp { from { transform: rotate(-8deg) scale(2.8); opacity: 0; } to { transform: rotate(-8deg) scale(1); opacity: .9; } }
  @keyframes winner-rays { to { transform: rotate(360deg); } }
  @keyframes winner-title { from { opacity: 0; letter-spacing: .8em; transform: translateY(-.5em); } to { opacity: 1; letter-spacing: .15em; transform: none; } }
  @keyframes winner-name { from { opacity: 0; transform: scale(.55); text-shadow: 0 0 0 transparent; } 65% { opacity: 1; transform: scale(1.06); text-shadow: 0 0 .15em var(--sand), 0 0 1em rgba(201,165,106,.55); } to { transform: scale(1); text-shadow: 0 0 .08em var(--sand), 0 0 .45em rgba(201,165,106,.3); } }
  @keyframes winner-button { from { opacity: 0; transform: translateY(1rem); } to { opacity: 1; transform: none; } }
  #duplicateEvent { pointer-events: none; }
  #entrySummary { color: var(--sand); overflow-wrap: anywhere; }
  #entry { overflow-y: auto; }
  #names { list-style: none; margin: 0; padding: 0; }
  #names li { padding: .6rem 1rem; overflow-wrap: anywhere; max-width: 100%; }
  .participant-list { display: flex; flex-wrap: wrap; justify-content: center; gap: .55rem; max-width: 1000px; margin: 0; padding: 0; list-style: none; }
  .participant-list li { padding: .55rem .9rem; border-left: 4px solid var(--c); border-radius: 3px; background: var(--card); border-top: 1px solid var(--line); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); font-weight: 700; }
  button:disabled { opacity: .4; cursor: default; }
  #answerInput {
    flex: 1 1 16rem; min-width: 0; padding: .55em .9em;
    font-size: 1.3rem; font-weight: 700;
    background: rgba(237, 227, 207, .05);
    border: 1px solid var(--current, var(--line)); border-left-width: 4px; border-radius: 4px;
    caret-color: var(--current, var(--sand)); outline: none;
  }
  /* 本番画面では入力欄を見せず、キーボード入力だけを受け付ける */
  .dock #answerInput {
    position: absolute; width: 1px; height: 1px; min-width: 1px; padding: 0;
    opacity: 0; overflow: hidden; clip-path: inset(50%); pointer-events: none;
  }
  #answerInput::placeholder { color: rgba(237, 227, 207, .32); }
  .tools { display: flex; gap: .4rem; }
  .keys { width: 100%; margin: 0; color: var(--muted); font-size: .8rem; }

  /* ============ 砂塵（Canvas） ============ */
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 40; }
  #fx.winner-fx { z-index: 70; }

  @media (prefers-reduced-motion: reduce) {
    .rec-dot, .letterbox, .ch.lock, .theme-band .tag.stamp, .word.new, .word.stamped, .word.stamped::after, #winnerEvent.winner-reveal::before, #winnerEvent.winner-reveal::after, #winnerEvent.winner-reveal #winnerTitle, #winnerEvent.winner-reveal #winnerName, #winnerEvent.winner-reveal #closeWinner { animation: none; }
    .words, .echo { transition: none; }
  }
</style>
</head>
<body>

<!-- お題入力 -->
<section id="entry" class="screen active" aria-label="参加者エントリー">
  <button id="fsBtnSetup" class="ghost setup-fs fs-toggle" type="button">全画面</button>
  <button class="ghost mode-toggle" type="button" aria-label="ライトモードへ切替" title="ライトモードへ切替">☼</button>
  <h1 id="entryHeading" hidden>最初の挑戦者は？</h1>
  <input id="nameInput" class="theme-field" type="text" placeholder="1人目の挑戦者" autocomplete="off" aria-label="参加者の名前">
  <p id="entryError" class="hint" role="status"></p>
  <ol class="names" id="names" aria-label="登録済みの参加者" aria-live="polite"></ol>
  <div class="setup-actions">
    <button id="entryBtn" class="primary" type="button" hidden>お題へ</button>
    <button id="undoEntryBtn" class="ghost" type="button">一つ戻す</button>
  </div>
</section>
<section id="setup" class="screen" aria-label="お題入力">
  <button class="ghost setup-fs fs-toggle" type="button">全画面</button>
  <button class="ghost mode-toggle" type="button" aria-label="ライトモードへ切替" title="ライトモードへ切替">☼</button>
  <h1 hidden>今回のお題は？</h1>
  <input id="themeInput" class="theme-field" type="text" placeholder="お題" autocomplete="off" aria-label="お題">
  <ol id="setupNames" class="participant-list" aria-label="参加者"></ol>
  <div class="setup-actions">
    <button id="startBtn" class="primary" type="button">ゲーム開始</button>
    <button id="editEntryBtn" class="ghost" type="button">参戦者を替える</button>
    <p class="hint"><kbd>Enter</kbd> でゲーム開始</p>
  </div>
</section>

<!-- 開始アナウンス -->
<section id="announce" class="screen" aria-live="assertive">
  <div class="letterbox top"></div>
  <p id="announceText" aria-label="それでは開始します"></p>
  <div class="letterbox bottom"></div>
</section>

<!-- 本番ボード -->
<section id="board" class="screen" aria-label="回答ボード">
  <header class="theme-band">
    <span class="tag" id="themeTag">お題</span>
    <span class="theme" id="themeText"></span>
    <div class="hud" aria-hidden="true">
      <span class="rec"><i class="rec-dot"></i>記録中</span>
      <span>発言 <span class="num" id="logCount">00</span></span>
      <span class="num" id="clock">00:00:00</span>
    </div>
  </header>
  <main class="words empty" id="words" aria-live="polite">
    <span class="placeholder">発言した順に回答を並べます</span>
  </main>
  <div class="players-strip" id="playersStrip">
    <div class="who-tabs" id="whoTabs" role="group" aria-label="発言者"></div>
  </div>
  <footer class="dock collapsed" id="dock">
    <button id="dockToggle" class="dock-toggle" type="button" aria-label="入力ドックを表示" title="入力ドックを表示">⌃</button>
    <div class="dock-body">
      <input id="answerInput" type="text" placeholder="発言をタイプして Enter" autocomplete="off" aria-label="回答者の発言">
      <div class="tools">
        <button id="undoBtn" class="ghost" type="button">一つ戻す</button>
        <button id="fsBtn" class="ghost fs-toggle" type="button">全画面</button>
        <button class="ghost mode-toggle" type="button" aria-label="ライトモードへ切替" title="ライトモードへ切替">☼</button>
        <button id="resetBtn" class="ghost" type="button">次のお題</button>
      </div>
      <p class="keys"><kbd>Enter</kbd> 追加（発言者は自動で次へ）　<kbd>Tab</kbd> 発言者切替　空欄で <kbd>Backspace</kbd> 一つ戻す　ドックは ⌃／⌄</p>
    </div>
  </footer>
</section>

<!-- エコー（入力中の巨大文字） -->
<div class="echo" id="echo" aria-hidden="true">
  <div class="echo-head"><i class="rec-dot"></i><span>受信中</span><span class="echo-who" id="echoWho"></span></div>
  <div class="echo-text" id="echoText"></div>
</div>

<div id="duplicateEvent" class="event-overlay" role="alert" hidden>
  <h2>すでに出た発言です</h2><p id="duplicateText"></p>
  <span>記録せず、そのままの手番で続けます</span>
</div>
<div id="winnerEvent" class="event-overlay" role="dialog" aria-modal="true" aria-labelledby="winnerTitle" aria-describedby="winnerName" hidden>
  <p class="winner-kicker">勝者</p><p id="winnerName"><span id="winnerNameText"></span><small>さん</small></p><h2 id="winnerTitle">おめでとう！</h2>
  <button id="closeWinner" class="ghost" type="button">ボードに戻る</button>
</div>
<canvas id="fx" aria-hidden="true"></canvas>

<script>
(() => {
  const COLORS = ['#E0533B', '#D9A441', '#3FA595', '#6F96CC', '#9DB46B', '#A881BE'];
  const SAND = '#C9A56A', GOLD = '#F1C75B', BONE = '#EDE3CF', DUNE = '#8A6E47';
  const MIN_PLAYERS = 2, MAX_PLAYERS = COLORS.length;
  const state = { theme: '', names: [], words: [], current: 0, eliminated: new Set(), winner: null };
  let winnerDustTimer = 0;

  const $ = id => document.getElementById(id);
  const screens = ['entry', 'setup', 'announce', 'board'];
  const show = id => screens.forEach(s => $(s).classList.toggle('active', s === id));
  const reduceMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
  const pad2 = n => String(n).padStart(2, '0');

  const themeInput = $('themeInput');
  const answerInput = $('answerInput');
  const wordsEl = $('words');
  const dockEl = $('dock');
  const boardEl = $('board');
  const echoEl = $('echo');
  const echoWho = $('echoWho');
  const echoText = $('echoText');

  // IME変換中のEnterを無視するための判定（F-3）
  const isComposingEnter = e => e.isComposing || e.keyCode === 229;

  // ============ 解読（E-2, E-5, E-6） ============
  const GLYPHS_WIDE = [...'暗号解読機密砂漠情報記録受信潜入任務別班アカサタナハマヤラワ０１２３４５６７８９＃％＆＊＋？'];
  const GLYPHS_NARROW = [...'ABCDEFGHJKLMNPQRSTUVWXYZ0123456789#%&*+?'];
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const isNarrow = ch => /^[\x20-\x7E]$/.test(ch);
  // span の中身をランダムな文字でちらつかせてから ch に確定させる
  function decode(span, ch, delay = 0) {
    if (reduceMotion() || ch === ' ' || ch === '\u00A0') { span.textContent = ch === ' ' ? '\u00A0' : ch; return; }
    const pool = isNarrow(ch) ? GLYPHS_NARROW : GLYPHS_WIDE;
    span.textContent = pick(pool);
    span.classList.add('scr');
    const steps = 6 + Math.floor(Math.random() * 3);
    const run = () => {
      let n = 0;
      const id = setInterval(() => {
        if (!span.isConnected) { clearInterval(id); return; }
        if (++n >= steps) {
          clearInterval(id);
          span.textContent = ch;
          span.classList.remove('scr');
          span.classList.add('lock');
        } else {
          span.textContent = pick(pool);
        }
      }, 45);
    };
    if (delay) setTimeout(run, delay); else run();
  }
  // 要素の文字列を1文字ずつ時間差で解読して表示する
  function decodeText(el, text, stagger) {
    el.innerHTML = '';
    [...text].forEach((c, i) => {
      const s = document.createElement('span');
      s.className = 'ch';
      s.setAttribute('aria-hidden', 'true');
      el.appendChild(s);
      decode(s, c, i * stagger);
    });
  }

  // ============ 砂塵（Canvas） ============
  const fx = $('fx');
  const ctx = fx.getContext('2d');
  let grains = [];
  let raf = 0;
  function sizeFx() {
    const d = window.devicePixelRatio || 1;
    fx.width = innerWidth * d;
    fx.height = innerHeight * d;
    ctx.setTransform(d, 0, 0, d, 0, 0);
  }
  sizeFx();
  window.addEventListener('resize', sizeFx);

  // 1点から風下（右）へ舞い上がる砂塵
  function dust(x, y, count = 40, colors = [SAND, BONE, DUNE], power = 1) {
    if (reduceMotion()) return;
    for (let i = 0; i < count; i++) {
      grains.push({
        x: x + (Math.random() - .5) * 20, y: y + (Math.random() - .5) * 10,
        vx: (1 + Math.random() * 4.5) * power,
        vy: (-Math.random() * 2.4 - .2) * power,
        g: .02 + Math.random() * .03,
        life: 1, decay: .008 + Math.random() * .014,
        r: .7 + Math.random() * 2.2,
        color: colors[i % colors.length],
      });
    }
    if (!raf) raf = requestAnimationFrame(tick);
  }
  // 画面を横切る砂嵐の帯
  function gust(y, height, count = 220, colors = [SAND, BONE, DUNE]) {
    if (reduceMotion()) return;
    for (let i = 0; i < count; i++) {
      grains.push({
        x: -Math.random() * innerWidth * .5, y: y + (Math.random() - .5) * height,
        vx: 6 + Math.random() * 12, vy: (Math.random() - .5) * .8,
        g: 0, life: 1, decay: .006 + Math.random() * .01,
        r: .6 + Math.random() * 1.8,
        color: colors[i % colors.length],
      });
    }
    if (!raf) raf = requestAnimationFrame(tick);
  }
  function startWinnerDust() {
    if (reduceMotion() || winnerDustTimer) return;
    const sprinkle = () => {
      for (let i = 0; i < 14; i++) {
        grains.push({
          x: Math.random() * innerWidth, y: -8 - Math.random() * 30,
          vx: (Math.random() - .5) * .7, vy: 1.2 + Math.random() * 2.2,
          g: .015 + Math.random() * .02, life: 1, decay: .003 + Math.random() * .003,
          r: .8 + Math.random() * 2, color: [GOLD, SAND, BONE][i % 3],
        });
      }
      if (!raf) raf = requestAnimationFrame(tick);
    };
    sprinkle();
    winnerDustTimer = setInterval(sprinkle, 180);
  }
  function stopWinnerDust() {
    if (!winnerDustTimer) return;
    clearInterval(winnerDustTimer);
    winnerDustTimer = 0;
  }
  function tick() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    grains = grains.filter(p => p.life > 0 && p.x < innerWidth + 40);
    for (const p of grains) {
      p.vy += p.g;
      p.vx *= .995;
      p.x += p.vx;
      p.y += p.vy;
      p.life -= p.decay;
      ctx.globalAlpha = Math.max(p.life, 0) * .9;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    raf = grains.length ? requestAnimationFrame(tick) : 0;
    if (!raf) ctx.clearRect(0, 0, innerWidth, innerHeight);
  }

  // ============ 時計（B-1） ============
  function updateClock() {
    const d = new Date();
    $('clock').textContent = `${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;
  }
  updateClock();
  setInterval(updateClock, 1000);

  // ============ お題入力画面 ============
  themeInput.addEventListener('keydown', e => {
    if (e.key !== 'Enter' || isComposingEnter(e)) return;
    e.preventDefault();
    start();
  });
  $('startBtn').addEventListener('click', start);

  const nameDrafts = [];
  const nameInput = $('nameInput');
  const namesEl = $('names');
  const setupNamesEl = $('setupNames');
  function renderParticipantList(target, names) {
    target.replaceChildren();
    names.forEach((name, i) => {
      const item = document.createElement('li');
      if (target === namesEl) item.className = 'name-chip';
      item.style.setProperty('--c', COLORS[i]);
      item.textContent = `${pad2(i + 1)}　${name}`;
      target.appendChild(item);
    });
  }
  function renderEntries() {
    renderParticipantList(namesEl, nameDrafts);
    nameInput.disabled = nameDrafts.length >= MAX_PLAYERS;
    $('entryHeading').textContent = nameInput.disabled ? '参戦者は6名。準備OK' : `${nameDrafts.length + 1}人目の挑戦者は？`;
    nameInput.placeholder = nameInput.disabled ? '参戦者は6名' : `${nameDrafts.length + 1}人目の挑戦者`;
    $('entryBtn').hidden = nameDrafts.length < MIN_PLAYERS;
    $('undoEntryBtn').disabled = !nameDrafts.length;
  }
  function openEntry() {
    renderEntries();
    $('entryError').textContent = '';
    show('entry');
    (nameInput.disabled ? $('entryBtn') : nameInput).focus();
  }
  function addEntry() {
    const name = nameInput.value.trim();
    if (!name) { $('entryError').textContent = '名前を入れてね'; nameInput.focus(); return; }
    if (nameDrafts.length >= MAX_PLAYERS) return;
    nameDrafts.push(name);
    nameInput.value = '';
    hideEcho();
    openEntry();
  }
  nameInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !isComposingEnter(e)) { e.preventDefault(); addEntry(); }
  });
  $('undoEntryBtn').addEventListener('click', () => {
    if (!nameDrafts.length) return;
    nameDrafts.pop();
    openEntry();
  });
  renderEntries();
  nameInput.focus();
  function completeEntry() {
    if (nameDrafts.length < MIN_PLAYERS) return;
    if (nameInput.value.trim()) { $('entryError').textContent = 'Enterでエントリーしてね'; nameInput.focus(); return; }
    if (!nameDrafts.length) return;
    state.names = [...nameDrafts];
    renderParticipantList(setupNamesEl, state.names);
    show('setup');
    themeInput.focus();
  }
  $('entryBtn').addEventListener('click', completeEntry);
  $('editEntryBtn').addEventListener('click', openEntry);

  function start() {
    const theme = themeInput.value.trim();
    if (!theme) { themeInput.focus(); themeInput.placeholder = 'お題を決めてね'; return; }
    state.theme = theme;
    hideEcho();
    state.names = [...nameDrafts];
    state.words = [];
    state.eliminated.clear();
    state.winner = null;
    answerInput.disabled = false;
    state.current = 0;
    $('themeText').textContent = theme;
    buildTabs();
    render();
    playAnnounce();
    setTimeout(() => {
      show('board');
      revealTheme();
      fit();
      answerInput.focus();
    }, reduceMotion() ? 900 : 1900);
  }

  // ============ 開始アナウンス（A-1, E-5） ============
  function playAnnounce() {
    const el = $('announceText');
    // 黒帯のアニメーションを毎回やり直す
    document.querySelectorAll('.letterbox').forEach(b => { b.style.animation = 'none'; void b.offsetWidth; b.style.animation = ''; });
    show('announce');
    decodeText(el, 'それでは開始します', 70);
    setTimeout(() => gust(innerHeight / 2, innerHeight * .35), 500);
  }

  // ============ お題の登場（B-1, E-6） ============
  function revealTheme() {
    const t = $('themeText');
    const tag = $('themeTag');
    tag.classList.remove('stamp');
    if (reduceMotion()) { t.textContent = state.theme; return; }
    t.setAttribute('aria-label', state.theme);
    const stagger = 55;
    decodeText(t, state.theme, stagger);
    void tag.offsetWidth;
    tag.style.setProperty('--d', `${[...state.theme].length * stagger + 350}ms`);
    tag.classList.add('stamp');
  }

  // ============ 発言者 ============
  function buildTabs() {
    const tabs = $('whoTabs');
    tabs.innerHTML = '';
    state.names.forEach((n, i) => {
      const box = document.createElement('div');
      box.className = 'player-box' + (state.eliminated.has(i) ? ' out' : '');
      box.style.setProperty('--c', COLORS[i]);
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = n;
      if (state.eliminated.has(i) || state.winner === i) {
        const icon = document.createElement('span');
        icon.className = 'state-icon';
        icon.textContent = state.eliminated.has(i) ? '✕' : '★';
        icon.setAttribute('aria-label', state.eliminated.has(i) ? '脱落' : '勝者');
        b.appendChild(icon);
      }
      b.dataset.player = i;
      b.disabled = state.eliminated.has(i);
      b.style.setProperty('--c', COLORS[i]);
      b.addEventListener('click', () => { setCurrent(i); answerInput.focus(); });
      const mark = document.createElement('button');
      mark.type = 'button';
      mark.className = 'eliminate';
      mark.textContent = state.eliminated.has(i) ? '復帰させる' : '脱落にする';
      mark.setAttribute('aria-label', `${n}を${mark.textContent}`);
      mark.disabled = !state.eliminated.has(i) && activePlayers().length <= 1;
      mark.addEventListener('click', () => toggleElimination(i));
      box.append(b, mark);
      tabs.appendChild(box);
    });
    setCurrent(state.current);
  }
  function activePlayers() { return state.names.map((_, i) => i).filter(i => !state.eliminated.has(i)); }
  function toggleElimination(i) {
    clearDuplicate();
    if (state.eliminated.has(i)) state.eliminated.delete(i);
    else if (activePlayers().length > 1) state.eliminated.add(i);
    const remaining = activePlayers();
    state.winner = state.names.length > 1 && remaining.length === 1 ? remaining[0] : null;
    answerInput.disabled = state.winner !== null;
    if (state.winner !== null) { answerInput.value = ''; hideEcho(); }
    buildTabs();
    // 脱落・復帰では発言内容が変わらないため、既存パネルの文字サイズを維持する
    if (state.winner !== null) {
      $('winnerNameText').textContent = state.names[state.winner];
      const winnerEvent = $('winnerEvent');
      winnerEvent.classList.remove('winner-reveal');
      void winnerEvent.offsetWidth;
      winnerEvent.classList.add('winner-reveal');
      winnerEvent.hidden = false;
      fx.classList.add('winner-fx');
      boardEl.inert = true;
      $('closeWinner').focus();
      startWinnerDust();
    } else answerInput.focus();
  }
  $('closeWinner').addEventListener('click', () => {
    $('winnerEvent').hidden = true;
    $('winnerEvent').classList.remove('winner-reveal');
    stopWinnerDust();
    fx.classList.remove('winner-fx');
    boardEl.inert = false;
    $('resetBtn').focus();
  });
  $('closeWinner').addEventListener('keydown', e => {
    if (e.key === 'Tab') { e.preventDefault(); }
    if (e.key === 'Escape') { e.stopPropagation(); $('closeWinner').click(); }
  });
  function setDockHidden(hidden) {
    dockEl.classList.toggle('collapsed', hidden);
    const toggle = $('dockToggle');
    toggle.textContent = hidden ? '⌃' : '⌄';
    toggle.setAttribute('aria-label', hidden ? '入力ドックを表示' : '入力ドックを折りたたむ');
    toggle.title = hidden ? '入力ドックを表示' : '入力ドックを折りたたむ';
    if (hidden) answerInput.blur(); else answerInput.focus();
  }
  $('dockToggle').addEventListener('click', () => setDockHidden(!dockEl.classList.contains('collapsed')));
  let duplicateTimer;
  function clearDuplicate() { clearTimeout(duplicateTimer); $('duplicateEvent').hidden = true; }
  function setCurrent(i) {
    const n = state.names.length;
    state.current = ((i % n) + n) % n;
    while (state.eliminated.has(state.current)) state.current = (state.current + 1) % n;
    $('whoTabs').querySelectorAll('[data-player]').forEach(b => b.setAttribute('aria-pressed', Number(b.dataset.player) === state.current));
    const color = COLORS[state.current];
    answerInput.style.setProperty('--current', color);
    answerInput.placeholder = '';
    echoEl.style.setProperty('--c', color);
    echoWho.textContent = state.names[state.current];
  }

  // ============ エコー（E-1〜E-3） ============
  let echoPrev = [];
  let stageEchoPrev = [];
  function updateEcho() {
    clearDuplicate();
    const chars = [...answerInput.value];
    if (!answerInput.value.trim()) { hideEcho(); return; }
    boardEl.classList.add('typing');
    echoEl.classList.add('show');
    // 先頭から一致している文字はそのまま残し、変わった部分だけ差し替えて解読する
    let p = 0;
    while (p < chars.length && p < echoPrev.length && chars[p] === echoPrev[p]) p++;
    while (echoText.childNodes.length > p) echoText.lastChild.remove();
    for (let i = p; i < chars.length; i++) {
      const s = document.createElement('span');
      s.className = 'ch';
      echoText.appendChild(s);
      decode(s, chars[i]);
    }
    echoPrev = chars;
    fitEcho();
  }
  function fitEcho() {
    echoText.style.fontSize = '';
    const max = innerWidth * .92;
    const w = echoText.scrollWidth;
    if (w > max) {
      const cur = parseFloat(getComputedStyle(echoText).fontSize);
      echoText.style.fontSize = (cur * max / w) + 'px';
    }
  }
  function hideEcho() {
    echoEl.classList.remove('show');
    boardEl.classList.remove('typing');
    echoText.innerHTML = '';
    echoPrev = [];
    stageEchoPrev = [];
  }
  answerInput.addEventListener('input', updateEcho);

  // エントリー名・お題も、発言と同じ解読エコーで受け付ける
  function updateStageEcho(input, label, color) {
    const chars = [...input.value];
    if (!input.value.trim()) { hideEcho(); stageEchoPrev = []; return; }
    echoEl.style.setProperty('--c', color);
    echoWho.textContent = label;
    echoEl.classList.add('show');
    let p = 0;
    while (p < chars.length && p < stageEchoPrev.length && chars[p] === stageEchoPrev[p]) p++;
    while (echoText.childNodes.length > p) echoText.lastChild.remove();
    for (let i = p; i < chars.length; i++) {
      const s = document.createElement('span');
      s.className = 'ch';
      echoText.appendChild(s);
      decode(s, chars[i]);
    }
    stageEchoPrev = chars;
    fitEcho();
  }
  nameInput.addEventListener('input', () => updateStageEcho(nameInput, 'エントリー', COLORS[nameDrafts.length % COLORS.length]));
  themeInput.addEventListener('input', () => updateStageEcho(themeInput, 'お題', SAND));

  // ============ 発言の入力（F-1〜F-7） ============
  answerInput.addEventListener('keydown', e => {
    if (state.winner !== null) return;
    if (e.key === 'Enter' && !isComposingEnter(e)) {
      e.preventDefault();
      const text = answerInput.value.trim();
      if (!text) return;
      if (state.words.some(w => w.text === text)) {
        hideEcho();
        clearDuplicate();
        $('duplicateText').textContent = text;
        $('duplicateEvent').hidden = false;
        duplicateTimer = setTimeout(clearDuplicate, 2200);
        answerInput.select();
        return;
      }
      clearDuplicate();
      const from = echoEl.classList.contains('show') ? echoText.getBoundingClientRect() : null;
      state.words.push({ text, who: state.current });
      answerInput.value = '';
      hideEcho();
      render();
      flyIn(wordsEl.lastElementChild, from);
      setCurrent(state.current + 1);
    } else if (e.key === 'Tab') {
      e.preventDefault();
      const active = activePlayers();
      setCurrent(active[(active.indexOf(state.current) + (e.shiftKey ? -1 : 1) + active.length) % active.length]);
    } else if (e.key === 'Backspace' && answerInput.value === '' && !isComposingEnter(e)) {
      e.preventDefault();
      undo();
    }
  });

  // エコーの位置から一覧の位置へ飛ばし、判子のように着地させる（D-6, E-4）
  function flyIn(el, from) {
    if (!el || !el.classList.contains('word')) return;
    if (reduceMotion()) return;
    if (!from || !el.animate) { el.classList.add('new'); return; }
    const to = el.getBoundingClientRect();
    if (!to.height) return;
    const s = from.height / to.height;
    const dx = (from.left + from.width / 2) - (to.left + to.width * s / 2);
    const dy = from.top - to.top;
    el.classList.add('flying');
    const anim = el.animate(
      [
        { transform: `translate(${dx}px, ${dy}px) scale(${s})` },
        { transform: 'translate(0, 0) scale(1)' },
      ],
      { duration: 680, easing: 'cubic-bezier(.5, 0, .25, 1)' }
    );
    anim.onfinish = () => {
      // 演出中に次の発言が追加されて再描画された場合は、古い要素の着地演出を行わない（E-8）
      if (!el.isConnected) return;
      el.classList.remove('flying');
      el.classList.add('stamped');
      const r = el.getBoundingClientRect();
      const c = getComputedStyle(el).getPropertyValue('--c').trim() || SAND;
      dust(r.left + r.width * .15, r.bottom, 28, [c, SAND, BONE]);
      dust(r.left + r.width * .75, r.bottom, 28, [SAND, DUNE, BONE]);
    };
  }

  function undo() {
    const last = state.words.pop();
    if (!last) return;
    setCurrent(last.who);
    render();
    answerInput.focus();
  }

  // ============ 描画（D-1〜D-8） ============
  function render() {
    wordsEl.innerHTML = '';
    $('logCount').textContent = pad2(state.words.length);
    wordsEl.classList.toggle('empty', state.words.length === 0);
    if (state.words.length === 0) {
      const p = document.createElement('span');
      p.className = 'placeholder';
      p.textContent = '発言した順に回答を並べます';
      wordsEl.appendChild(p);
      return;
    }
    const lastIdx = state.words.length - 1;
    state.words.forEach((w, i) => {
      const el = document.createElement('div');
      el.className = 'word' + (i === lastIdx ? ' latest' : '');
      el.style.setProperty('--c', COLORS[w.who]);
      const num = document.createElement('span');
      num.className = 'num';
      num.textContent = pad2(i + 1);
      const body = document.createElement('span');
      body.className = 'body';
      const t = document.createElement('span');
      t.className = 'text';
      t.textContent = w.text;
      const who = document.createElement('span');
      who.className = 'who';
      who.textContent = state.names[w.who];
      body.append(t, who);
      el.append(num, body);
      wordsEl.appendChild(el);
    });
    fit();
  }

  // 単語が増えても画面に収まるよう文字サイズを自動調整（D-8）
  function fit() {
    if (!boardEl.classList.contains('active') || state.words.length === 0) return;
    // ドックの再描画中など、発言領域の高さが未確定なフレームでは計算しない
    if (wordsEl.clientHeight <= 0 || wordsEl.clientWidth <= 0) return;
    const maxSize = Math.min(innerHeight * 0.13, innerWidth * 0.085, 140);
    const cells = [...wordsEl.children];
    // パネル全体だけでなく、発言の文字自体が右の余白に食い込んでいないかも判定する（D-7）
    const fits = () =>
      wordsEl.scrollHeight <= wordsEl.clientHeight + 1 &&
      cells.every(c => {
        const t = c.querySelector('.text');
        return c.scrollWidth <= c.clientWidth + 1 && (!t || t.scrollWidth <= t.clientWidth + 1);
      });

    // 1列の行数は「回答者数×2」。最初の3列までは列幅を固定して、表示位置が動かないようにする
    const PER_COL = state.names.length * 2;
    const cols = Math.max(3, Math.ceil(state.words.length / PER_COL));
    wordsEl.style.setProperty('--rows', PER_COL);
    wordsEl.style.setProperty('--cols', cols);
    let lo = 10, hi = maxSize;
    for (let k = 0; k < 14; k++) {
      const mid = (lo + hi) / 2;
      wordsEl.style.fontSize = mid + 'px';
      if (fits()) lo = mid; else hi = mid;
    }
    wordsEl.style.fontSize = lo + 'px';
  }
  window.addEventListener('resize', () => { fit(); if (echoEl.classList.contains('show')) fitEcho(); });

  // ============ ツール ============
  $('undoBtn').addEventListener('click', undo);

  // 全画面の切替（FS-1〜FS-4）
  const fsButtons = document.querySelectorAll('.fs-toggle');
  fsButtons.forEach(btn => btn.addEventListener('click', () => {
    const d = document;
    if (!d.fullscreenElement) d.documentElement.requestFullscreen?.().catch(() => {});
    else d.exitFullscreen?.();
    ($('entry').classList.contains('active') ? (nameInput.disabled ? $('entryBtn') : nameInput) : $('setup').classList.contains('active') ? themeInput : answerInput).focus();
  }));
  document.addEventListener('fullscreenchange', () => {
    const label = document.fullscreenElement ? '全画面を終了' : '全画面';
    fsButtons.forEach(btn => { btn.textContent = label; });
    setTimeout(fit, 60);
  });

  // 表示モード切替（夜の会場／屋外の明るい環境）
  const modeButtons = document.querySelectorAll('.mode-toggle');
  function updateModeLabels() {
    const light = document.body.classList.contains('light');
    const icon = light ? '☾' : '☼';
    const label = light ? 'ダークモードへ切替' : 'ライトモードへ切替';
    modeButtons.forEach(btn => { btn.textContent = icon; btn.setAttribute('aria-label', label); btn.title = label; });
  }
  modeButtons.forEach(btn => btn.addEventListener('click', () => {
    document.body.classList.toggle('light');
    updateModeLabels();
    ($('entry').classList.contains('active') ? (nameInput.disabled ? $('entryBtn') : nameInput) : $('setup').classList.contains('active') ? themeInput : answerInput).focus();
  }));
  updateModeLabels();

  // 新しいお題（R-1〜R-5）。confirm() は埋め込み環境で動かないため2回押しで確定する
  const resetBtn = $('resetBtn');
  let resetArmed = null;
  function disarmReset() {
    clearTimeout(resetArmed);
    resetArmed = null;
    resetBtn.textContent = '次のお題';
    resetBtn.classList.remove('armed');
  }
  resetBtn.addEventListener('click', () => {
    if (state.words.length && !resetArmed) {
      resetBtn.textContent = 'もう一度押すと回答を消去';
      resetBtn.classList.add('armed');
      resetArmed = setTimeout(disarmReset, 3000);
      return;
    }
    disarmReset();
    clearDuplicate();
    state.words = [];
    answerInput.value = '';
    hideEcho();
    render();
    setDockHidden(false);
    themeInput.value = '';
    themeInput.placeholder = '例：夏の終わり';
    show('setup');
    themeInput.focus();
  });

  // ドックを隠している間に文字を打つと自動で再表示（V-2）。Escは全画面操作に委ねる。
  document.addEventListener('keydown', e => {
    if (!boardEl.classList.contains('active') || !dockEl.classList.contains('collapsed')) return;
    if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
      setDockHidden(false);
    }
  });
})();
</script>
</body>
</html>
